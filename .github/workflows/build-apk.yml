name: Build Android APK

# Construit une APK Android installable (coquille WebView autour de l'app web)
# et la publie comme artefact téléchargeable. Sur un tag « v* », l'APK est aussi
# attachée à une Release GitHub (lien de téléchargement direct).

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # nécessaire pour créer une Release sur les tags

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Installe explicitement les composants requis. Évite le paquet « tools »
          # (obsolète, retiré du dépôt) que l'action tente d'installer par défaut.
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/MangaTrad.apk
          ls -lh dist

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MangaTrad-APK
          path: dist/MangaTrad.apk
          if-no-files-found: error

      # Publie l'APK dans une Release GitHub (lien de téléchargement direct).
      # - push sur main   -> Release « latest » mise à jour à chaque build.
      # - push d'un tag v* -> Release figée pour cette version.
      # La Release est créée côté Actions (jeton contents: write), ce qui ne
      # dépend pas d'un push de tag manuel.
      - name: Publish Release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'MangaTrad — dernière APK' }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          files: dist/MangaTrad.apk
          generate_release_notes: true
